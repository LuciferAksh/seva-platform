# Optional: publish the browser-local demo only. No API or database is required.
services:
  - type: web
    runtime: static
    name: seva-community-demo
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: VITE_APP_MODE
        value: demo
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
